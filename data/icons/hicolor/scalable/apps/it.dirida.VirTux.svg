<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- monitor body -->
  <rect x="5" y="9" width="54" height="38" rx="4" fill="#241f31"/>
  <rect x="8" y="12" width="48" height="32" rx="2" fill="url(#screen)"/>

  <!-- stand -->
  <rect x="26" y="47" width="12" height="6" fill="#241f31"/>
  <rect x="18" y="52" width="28" height="4" rx="2" fill="#241f31"/>

  <!-- stacked "machines" on the screen -->
  <rect x="13" y="17" width="17" height="5" rx="1.5" fill="#ffffff" opacity="0.9"/>
  <rect x="13" y="25" width="17" height="5" rx="1.5" fill="#ffffff" opacity="0.6"/>
  <rect x="13" y="33" width="17" height="5" rx="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- running indicator: a play triangle -->
  <path d="M37 21.5 L37 34.5 L48 28 Z" fill="#8ff0a4"/>
</svg>
